

name: Build Monsatak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        working-directory: apps/student
        run: flutter create --platforms=android --org com.monsatak .

      - name: Install dependencies
        working-directory: apps/student
        run: flutter pub get

      - name: Build APK
        working-directory: apps/student
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monsatak-apk
          path: apps/student/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
